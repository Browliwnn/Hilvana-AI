name = "hilvana-ai" # debe coincidir con el nombre del Worker en Cloudflare
main = "worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true # el despliegue NO borra las variables que pongas en el panel de Cloudflare

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secretos y variables: NO van aquí. Local: .dev.vars. Producción: Cloudflare → tu Worker → Settings → Variables and secrets.
